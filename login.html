<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - MachanStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container">
                <a class="navbar-brand titulo-principal m-0" href="index.html">⋆｡ · ˚ʚ MachanStore ɞ ˚· ｡⋆</a>
                <div class="navbar-nav ms-auto align-items-center">
                    <a class="boton-menu" href="index.html">Inicio</a>
                    <a class="boton-menu" href="productos.html">Productos</a>
                    <a class="boton-menu" href="contacto.html">Contacto</a>
                    <a class="boton-menu" href="carrito.html">
                        Carrito <span id="carrito-contador" class="badge rounded-pill bg-danger">0</span>
                    </a>
                    <a class="boton-menu active" href="login.html">Iniciar sesión</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5" style="max-width: 440px;">
        <div class="bg-white p-4 rounded shadow-sm border">
            <h2 class="text-center mb-3">⤷ Iniciar Sesión ˎˊ˗</h2>
            
            <form id="formLogin" novalidate>
                <div class="mb-3">
                    <label for="loginEmail" class="form-label fw-bold">Correo Electrónico:</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="tu@correo.com" autocomplete="email">
                    <small class="mensaje-error text-danger small" id="errorLoginEmail" style="display: none;"></small>
                </div>

                <div class="mb-3">
                    <label for="loginPassword" class="form-label fw-bold">Contraseña:</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" autocomplete="current-password">
                    <small class="mensaje-error text-danger small" id="errorLoginPassword" style="display: none;"></small>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 mt-2" style="background-color: #5b4b7a; border: none;">
                    Ingresar
                </button>

                <div id="mensajeLoginGlobal" class="alert alert-danger mt-3 text-center" style="display: none;"></div>
            </form>

            <div class="alert alert-info mt-3 p-2 small">
                <strong>Cuenta Admin de prueba:</strong><br>
                Correo: <code>admin@machanstore.cl</code><br>
                Clave: <code>admin123</code>
            </div>

            <div class="text-center mt-3 small">
                ¿No tienes una cuenta? <a href="registro.html" class="fw-bold" style="color: #5b4b7a;">Regístrate aquí</a>
            </div>
        </div>
    </main>

    <footer> 
        <h3>𐙚 MachanStore Team 2026:</h3>
        <p>Kevin Pérez · Benjamín Tapia · William Zamorano</p>
    </footer>
    <script src="js/session.js"></script>
    <script src="js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
