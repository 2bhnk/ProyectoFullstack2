    <main class="container my-5 text-start">
        <h2 class="mb-4 text-center">⤷ ゛Mi carrito de compras ˎˊ˗</h2>
        
        <div class="row">
            
            <div class="col-lg-8">
                <!-- modificar con js -->
                <div id="lista-carrito" class="d-flex flex-column gap-3">
                    
                    <p class="text-center text-muted mt-4">Tu carrito está vacío.</p>
                </div>
            </div>

            
            <div class="col-lg-4 mt-4 mt-lg-0">
                <div class="card shadow-sm border-secondary">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h4 class="m-0">TOTAL:</h4>
                            <!-- actualizar con js -->
                            <h4 class="m-0 text-success fw-bold" id="total-carrito">$ 0</h4>
                        </div>
                        
                        <div class="mb-3">
                            <label for="cupon" class="form-label small text-muted">Ingresa un cupón de descuento</label>
                            <div class="input-group">
                                <input type="text" id="cupon" class="form-control" placeholder="Ej: PRIDE2026">
                                <button class="btn btn-outline-secondary" type="button">Aplicar</button>
                            </div>
                        </div>

                        <button class="btn btn-success w-100 fw-bold py-2">PAGAR</button>
                    </div>
                </div>
            </div>
